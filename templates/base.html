<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Scientific Methodology Extractor</title><style>:root{color-scheme:dark}body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;background:#0b1220;color:#e5edf7;line-height:1.5}nav{display:flex;justify-content:space-between;border-bottom:1px solid #26364d;padding-bottom:1rem}a{color:#7dd3fc}a:hover{color:#bae6fd}table{width:100%;border-collapse:collapse;background:#111c2f;border:1px solid #26364d;border-radius:.5rem;overflow:hidden}td,th{padding:.7rem;border-bottom:1px solid #26364d;text-align:left}th{background:#17263d;color:#cbd5e1}.button{background:#0284c7;color:#f8fafc;padding:.55rem .9rem;border-radius:.35rem;border:0;font:inherit}.button:hover{background:#0369a1}.messages{padding:0;list-style:none}.success{color:#86efac}.error{color:#fca5a5}.entity-group{margin:2rem 0;border-top:1px solid #26364d}.entity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}.entity-card{border:1px solid #26364d;border-radius:.5rem;padding:1rem;background:#111c2f;min-width:0}.entity-card h2,.entity-card h3{margin:.1rem 0 .7rem;color:#f1f5f9}.entity-card ul{margin:.5rem 0;padding-left:1.2rem}.evidence{border-top:1px solid #26364d;margin-top:1rem;padding-top:.7rem;overflow-wrap:anywhere;color:#cbd5e1}.evidence p{margin:.35rem 0}.pipeline{padding:1rem;background:#111c2f;border-left:3px solid #38bdf8;border-radius:.3rem;overflow-wrap:anywhere}@media(max-width:600px){body{margin:1rem auto}nav{gap:.75rem;align-items:center}.entity-grid{grid-template-columns:1fr}}</style></head><body><nav><a href="{% url 'papers:dashboard' %}">Scientific Methodology Extractor</a><a class="button" href="{% url 'papers:upload' %}">Upload PDF</a></nav><main>{% if messages %}<ul class="messages">{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul>{% endif %}{% block content %}{% endblock %}</main></body></html>
